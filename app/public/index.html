<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8590C" />
    <meta name="description" content="Nối từ tiếng Việt cùng bạn bè — hơn 45.000 từ." />
    <!-- Cài lên màn hình chính như một app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nối Từ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nối Từ</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #FFF8EE; }
      /* 100dvh: không bị thanh địa chỉ trình duyệt điện thoại che mất phần dưới */
      body { overflow: hidden; height: 100dvh; margin: 0; overscroll-behavior: none;
             -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1;
              padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
              box-sizing: border-box; }
      /* chữ trong ô nhập >= 16px để iPhone không tự phóng to khi gõ */
      input { font-size: 16px; }
    </style>
  </head>
  <body>
    <noscript>Bạn cần bật JavaScript để chơi Nối Từ.</noscript>
    <div id="root"></div>
  </body>
</html>
