<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>ThoiTrang v5 Icon Atlas Builder</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js"
      }
    }
  </script>
</head>
<body style="margin:0;background:#111;color:#fff;font-family:sans-serif">
<pre id="log">Đang khởi tạo renderer v5…</pre>
<script type="module">
import * as THREE from 'three';
import {
  Doll, BUILD, CATALOG_META, BODY_TYPES, BODY_DEFAULTS, FACE_OPTS, EXPRESSIONS, SKINS, ACC_SUB, animate,
} from '/src/thoitrang3d/doll.js';

const TILE = 112;
const COLS = 24;

const FRAME = {
  hair: [1.36, 1.02, 0.14],
  hat: [1.49, 1.32, 0.16],
  glasses: [1.34, 0.66, 0],
  top: [0.98, 1.42, 0],
  outer: [0.94, 1.72, 0],
  bottom: [0.50, 1.94, 0],
  dress: [0.74, 2.60, 0],
  shoes: [0.09, 0.90, 0.25],
  acc: [0.94, 1.95, 0],
};

const defFace = () => ({
  eyes: 'round', eyeColor: '#4a2d24', brows: 'arched', mouth: 'smile', lipColor: '#e0707a',
  nose: 'button', blush: 'soft', freckles: false, beautyMark: 'none',
  eyeliner: 'classic', eyeshadow: 'none', eyeshadowColor: '#b990e8', beard: 'none', expression: 'neutral',
});

const MALE_SLOTS = new Set(['hair', 'top', 'outer', 'bottom', 'dress', 'shoes']);

async function buildAtlas() {
  const res = await fetch('/archetypes.json');
  const payload = res.ok ? await res.json() : { archetypes: CATALOG_META, accSub: ACC_SUB };
  const archetypes = payload.archetypes || CATALOG_META;
  const accSubMap = { ...ACC_SUB, ...(payload.accSub || {}) };

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(TILE, TILE, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#e8d3e6', 2.2));
  const key = new THREE.DirectionalLight('#ffffff', 1.6);
  key.position.set(1, 2, 3);
  scene.add(key);

  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
  const ghostF = new Doll({ ghost: true, type: 'nu_manh', skin: SKINS[1] });
  const ghostM = new Doll({ ghost: true, type: 'nam_thu_sinh', skin: SKINS[1] });
  const faceDoll = new Doll({ type: 'nu_manh', skin: SKINS[1] });
  const maleFaceDoll = new Doll({ type: 'nam_thu_sinh', skin: SKINS[1] });

  const jobs = [];
  const missingBuilders = [];

  // 1. All ~442 bespoke 3D archetype items across 9 categories
  for (const [slot, items] of Object.entries(archetypes)) {
    for (const meta of items) {
      if (!BUILD[slot] || !BUILD[slot][meta.id]) {
        missingBuilders.push(`${slot}:${meta.id}`);
      }
      jobs.push({ kind: 'item', key: `${slot}:${meta.id}`, slot, meta });
    }
  }
  // 2. All 6 body types
  for (const [type] of BODY_TYPES) {
    jobs.push({ kind: 'body', key: `body:${type}`, type });
  }
  // 3. All 14 expressions + all face option categories (72 tiles)
  for (const [id] of EXPRESSIONS) {
    jobs.push({ kind: 'face', key: `face_expression:${id}`, field: 'expression', id });
  }
  const faceFields = [
    ['eyes', FACE_OPTS.eyes],
    ['brows', FACE_OPTS.brows],
    ['mouth', FACE_OPTS.mouths],
    ['nose', FACE_OPTS.noses],
    ['blush', FACE_OPTS.blush],
    ['eyeliner', FACE_OPTS.eyeliner],
    ['eyeshadow', FACE_OPTS.eyeshadow],
    ['beautyMark', FACE_OPTS.beautyMark],
    ['beard', FACE_OPTS.beard],
  ];
  for (const [field, list] of faceFields) {
    for (const [id] of list) {
      jobs.push({ kind: 'face', key: `face_${field}:${id}`, field, id });
    }
  }
  jobs.push({ kind: 'face', key: 'face_freckles:on', field: 'freckles', id: true });

  const rows = Math.ceil(jobs.length / COLS);
  const atlasW = COLS * TILE;
  const atlasH = rows * TILE;
  const atlas = document.createElement('canvas');
  atlas.width = atlasW;
  atlas.height = atlasH;
  const ctx = atlas.getContext('2d');
  ctx.clearRect(0, 0, atlasW, atlasH);

  const itemsMap = {};

  for (let i = 0; i < jobs.length; i++) {
    const job = jobs[i];
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    const x = col * TILE;
    const y = row * TILE;

    scene.remove(ghostF.root, ghostM.root, faceDoll.root, maleFaceDoll.root);

    if (job.kind === 'item') {
      const { slot, meta } = job;
      const useMaleGhost = meta.group === 'nam' && MALE_SLOTS.has(slot);
      const ghost = useMaleGhost ? ghostM : ghostF;
      const o = { type: useMaleGhost ? 'nam_thu_sinh' : 'nu_manh', skin: SKINS[1] };
      o[slot] = { id: meta.id, c: meta.c, c2: meta.c2, p: meta.p || 'plain' };
      if (slot !== 'hair') o.hair = null;
      ghost.apply(o);
      animate(ghost, 'idle', 0);

      const hasHeadMesh = (ghost.slots[slot] || []).some((m) => m.parent === ghost.j.head);
      ghost.j.head.visible = ['hair', 'hat', 'glasses'].includes(slot) || hasHeadMesh;

      const sub = slot === 'acc' ? accSubMap[meta.id] : null;
      if (slot === 'acc') {
        if (sub === 'back') ghost.root.rotation.y = 2.55;
        else if (sub === 'tail') ghost.root.rotation.y = 2.45;
        else if (sub === 'handL') ghost.root.rotation.y = -0.35;
        else ghost.root.rotation.y = 0.42;
      } else {
        ghost.root.rotation.y = 0.35;
      }

      let frame = FRAME[slot];
      if (slot === 'dress' && hasHeadMesh) {
        frame = [0.78, 2.82, 0.04];
      } else if (slot === 'acc') {
        if (sub === 'ears' || sub === 'head') frame = [1.34, 0.96, 0.1];
        else if (sub === 'neck') frame = [1.14, 1.08, 0.08];
        else if (sub === 'waist') frame = [0.84, 1.30, 0.08];
        else if (sub === 'wrists') frame = [0.76, 1.44, 0.06];
        else if (sub === 'handR') frame = [0.64, 1.38, 0.04];
        else if (sub === 'hipBag') frame = [0.78, 1.35, 0.06];
        else if (sub === 'handL') frame = [0.78, 1.58, 0.05];
        else if (sub === 'chestProp') frame = [0.92, 1.48, 0.05];
        else if (sub === 'back') frame = [0.96, 2.02, 0.04];
        else if (sub === 'tail') frame = [0.66, 1.78, 0.06];
      }
      const [fy, dist, el] = frame;
      cam.position.set(0, fy + el * dist, dist);
      cam.lookAt(0, fy, 0);
      scene.add(ghost.root);
      renderer.render(scene, cam);
    } else if (job.kind === 'body') {
      const bd = BODY_DEFAULTS[job.type] || BODY_DEFAULTS.nu_manh;
      const p = new Doll({ type: job.type, skin: SKINS[1] });
      p.apply({
        type: job.type, skin: SKINS[1], height: 1.0,
        face: { ...defFace(), eyes: bd.eyes, brows: bd.brows, eyeliner: bd.eyeliner, blush: bd.blush, nose: bd.nose },
        hair: { id: bd.hair, c: '#33211b', c2: '#33211b', twoTone: 'none' },
        top: { id: 'tee', c: '#ffffff', c2: '#ff6b8b', p: 'plain' },
        bottom: { id: 'shorts', c: '#2f6fd6', c2: '#ffffff', p: 'plain' },
        shoes: { id: 'sneaker', c: '#ffffff', c2: '#ff6b8b', p: 'plain' },
      });
      animate(p, 'idle', 0);
      p.root.rotation.y = 0.25;
      cam.position.set(0, 0.88, 3.6);
      cam.lookAt(0, 0.80, 0);
      scene.add(p.root);
      renderer.render(scene, cam);
      scene.remove(p.root);
    } else if (job.kind === 'face') {
      const isBeard = job.field === 'beard';
      const target = isBeard ? maleFaceDoll : faceDoll;
      const f = {
        ...defFace(),
        ...(isBeard ? { brows: 'thick', blush: 'none', eyeliner: 'none', nose: 'sharp' } : {}),
        ...(job.field === 'eyeshadow' ? { eyeshadowColor: '#b990e8' } : {}),
        ...(job.field === 'eyeliner' ? { eyes: 'almond' } : {}),
        [job.field]: job.id,
      };
      target.apply({
        type: isBeard ? 'nam_thu_sinh' : 'nu_manh',
        skin: SKINS[1],
        height: 1.0,
        face: f,
        hair: { id: isBeard ? 'side_part' : 'bob', c: '#33211b', c2: '#33211b', twoTone: 'none' },
      });
      animate(target, 'idle', 0);
      target.root.rotation.y = 0.08;
      const hy = target.Y.head;
      cam.position.set(0, hy - 0.01, 0.72);
      cam.lookAt(0, hy - 0.02, 0);
      scene.add(target.root);
      renderer.render(scene, cam);
    }

    ctx.drawImage(renderer.domElement, x, y, TILE, TILE);
    itemsMap[job.key] = { x, y, w: TILE, h: TILE };
  }

  renderer.dispose();
  document.getElementById('log').textContent = `Xong ${jobs.length} icon (${atlasW}x${atlasH})`;
  window.__THOITRANG_ATLAS__ = {
    meta: { width: atlasW, height: atlasH, tile: TILE, cols: COLS, rows, count: jobs.length },
    items: itemsMap,
    missingBuilders,
    pngDataUrl: atlas.toDataURL('image/png'),
  };
}

buildAtlas().catch((err) => {
  window.__THOITRANG_ATLAS_ERROR__ = String(err?.stack || err);
  document.getElementById('log').textContent = 'Lỗi: ' + window.__THOITRANG_ATLAS_ERROR__;
});
</script>
</body>
</html>
