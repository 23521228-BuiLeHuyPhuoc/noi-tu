services:
  - type: web
    name: noi-tu-server
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # giới hạn heap V8 vừa khung 512MB của gói Free để tránh tràn RAM / giật GC
      - key: NODE_OPTIONS
        value: "--max-old-space-size=448"
      # chuỗi kết nối MongoDB: nhập trong Render (Environment), KHÔNG ghi vào file này
      - key: DATABASE
        sync: false
      - key: DATABASE_NAME
        value: xomlay
      # Cloudinary: nhập riêng trong Render, KHÔNG ghi API secret vào repo
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Bản web của app: mở link là chơi được trên mọi điện thoại (kể cả iPhone)
  - type: web
    name: noi-tu-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd app && npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: app/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SERVER_URL
        value: https://noi-tu-server.onrender.com
      - key: EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH
        value: "1"
      - key: EXPO_UNSTABLE_TREE_SHAKING
        value: "1"
    # index.html luôn hỏi lại để điện thoại nhận bản mới ngay; các bundle/icon có hash hoặc tĩnh thì cache dài hạn trên CDN
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fluent/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
