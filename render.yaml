services:
  # Render không đổi được vùng của service có sẵn, nên server Singapore (gần MongoDB Atlas) là service mới;
  # service "noi-tu-server" cũ ở Oregon đã bỏ.
  - type: web
    name: noi-tu-server-sg
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # giới hạn heap V8 vừa khung 512MB của gói Free để tránh tràn RAM / giật GC
      - key: NODE_OPTIONS
        value: "--max-old-space-size=448"
      - key: DATABASE_NAME
        value: xomlay
      # Biến bí mật (DATABASE, CLOUDINARY_*, SMTP_USER/SMTP_PASS, ADMIN_USERNAMES) nằm trong Environment Group
      # "noi-tu-server-env" trên Render. Sửa giá trị ở đó, KHÔNG ghi vào file này.
      - fromGroup: noi-tu-server-env

  # Bản web của app: mở link là chơi được trên mọi điện thoại (kể cả iPhone)
  - type: web
    name: noi-tu-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd app && npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: app/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SERVER_URL
        value: https://noi-tu-server-sg.onrender.com
      - key: EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH
        value: "1"
      - key: EXPO_UNSTABLE_TREE_SHAKING
        value: "1"
    # index.html luôn hỏi lại để điện thoại nhận bản mới ngay; các bundle/icon có hash hoặc tĩnh thì cache dài hạn trên CDN
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fluent/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
