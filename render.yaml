services:
  - type: web
    name: noi-tu-server
    runtime: node
    plan: free
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # chuỗi kết nối MongoDB: nhập trong Render (Environment), KHÔNG ghi vào file này
      - key: DATABASE
        sync: false
      - key: DATABASE_NAME
        value: xomlay
      # Cloudinary: nhập riêng trong Render, KHÔNG ghi API secret vào repo
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Bản web của app: mở link là chơi được trên mọi điện thoại (kể cả iPhone)
  - type: web
    name: noi-tu-web
    runtime: static
    buildCommand: cd app && npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: app/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SERVER_URL
        value: https://noi-tu-server.onrender.com
    # luôn hỏi lại server để điện thoại không bị kẹt bản cũ sau mỗi lần cập nhật
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
