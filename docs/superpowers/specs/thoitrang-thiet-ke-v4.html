<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sàn Diễn — thiết kế v4</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{--pink:#ff5c8a;--pink2:#ffb3c7;--ink:#3b2a3f;--ink2:#7a6880;--glass:rgba(255,255,255,.88);--line:#f1e3ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#f7e9f5;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.pill{background:var(--glass);border-radius:999px;box-shadow:0 6px 24px rgba(160,90,150,.18);backdrop-filter:blur(10px)}
.top{position:fixed;top:14px;left:98px;right:420px;display:flex;gap:10px;align-items:center;z-index:3}
.brand{padding:9px 16px;font-weight:800;font-size:17px;color:var(--pink);white-space:nowrap}
.theme{flex:1;padding:9px 18px;display:flex;flex-direction:column;border-radius:20px;min-width:0}
.theme small{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--pink)}
.theme b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{padding:11px 16px;font-weight:800;font-size:17px;background:linear-gradient(135deg,#ff7aa2,#ff5c8a);color:#fff;white-space:nowrap}
.players{position:fixed;top:14px;right:16px;width:392px;display:flex;gap:8px;justify-content:flex-end;z-index:3}
.pl{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(160,90,150,.2);position:relative;overflow:hidden;border:3px solid #fff}
.pl img{width:100%;height:100%;object-fit:cover}
.pl.ok::after{content:'✓';position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:#5fd3a6;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}
.rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding:7px;border-radius:26px;z-index:3;max-height:calc(100vh - 20px);overflow-y:auto}
.rail::-webkit-scrollbar{display:none}
.cat{width:62px;padding:3px 0;border-radius:16px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:600 10px 'Be Vietnam Pro';color:var(--ink2)}
.cat i{font-style:normal;font-size:19px;width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:#fff4f8}
.cat.on{color:var(--pink)}.cat.on i{background:linear-gradient(135deg,#ff8fb0,#ff5c8a);box-shadow:0 4px 12px rgba(255,92,138,.4)}
.closet{position:fixed;right:16px;top:78px;bottom:14px;width:392px;border-radius:26px;padding:15px;display:flex;flex-direction:column;gap:9px;z-index:3}
.closet h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.closet h3 em{font-style:normal;font-size:12px;color:var(--ink2);font-weight:600}
.search{border:2px solid var(--line);border-radius:13px;padding:7px 12px;font:inherit;font-size:12.5px;outline:none;background:#fff}
.search:focus{border-color:var(--pink2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:auto;padding:2px;flex:1;align-content:start}
.grid.face-mode{display:flex;flex-direction:column;gap:10px}
.fsub{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fsub b{padding:5px 10px;border-radius:999px;background:#fff4f8;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink2)}
.fsub b.on{background:var(--pink);color:#fff}
.fblk{display:flex;flex-direction:column;gap:6px}
.fblk label{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.06em}
.hslider{grid-column:1/-1;background:#fff6fa;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hslider label{font-size:12px;font-weight:700;display:flex;justify-content:space-between;color:var(--ink)}
.hslider input{accent-color:var(--pink);width:100%;cursor:pointer}
.card{border:3px solid transparent;border-radius:18px;background:#fff6fa;cursor:pointer;padding:5px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:11px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.card img{width:100%;aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff,#fde7f1)}
.card.on{border-color:var(--pink);background:#fff}
.card.on::after{content:'✓';position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:11px}
.card.none{justify-content:center;color:var(--ink2);font-size:26px;min-height:92px}
.row label{font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.06em;display:block;margin-bottom:4px}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw b{width:21px;height:21px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.10)}
.sw b.on{outline:2.5px solid var(--pink);outline-offset:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
#r3 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
#r3 .chips::-webkit-scrollbar{height:4px}
#r3 .chips b{flex:0 0 auto}
.chips b{padding:5px 10px;border-radius:999px;background:#fff4f8;font-size:11.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.chips b.on{background:var(--pink);color:#fff}
.dock{position:fixed;bottom:20px;left:calc(50% - 196px);transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:3}
.dock button{border:0;font:800 14px 'Be Vietnam Pro';cursor:pointer;color:var(--ink)}
.round{width:48px;height:48px;border-radius:50%;background:var(--glass);box-shadow:0 6px 18px rgba(160,90,150,.2);font-size:19px!important}
.done{padding:15px 38px;border-radius:999px;background:linear-gradient(135deg,#ff8fb0,#ff4f7f)!important;color:#fff!important;font-size:17px!important;box-shadow:0 10px 28px rgba(255,79,127,.45)}
.runway .closet,.runway .rail,.runway .dock,.runway .players{display:none}
.rate{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:24px;z-index:3;text-align:center;max-width:min(94vw,760px)}
.runway .rate{display:block}.rate small{font-weight:800;color:var(--pink);letter-spacing:.1em;font-size:11px}
.stars{font-size:32px;letter-spacing:3px;color:#ffd24d;text-shadow:0 2px 0 #e0a800;line-height:1.1}.stars s{text-decoration:none;color:#e9dbe6;text-shadow:none}
.poses{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:7px}
.poses b{padding:6px 11px;border-radius:999px;background:#fff4f8;font-size:11.5px;cursor:pointer;font-weight:700;color:var(--ink)}
.poses b.on{background:var(--pink);color:#fff}
.runway .top{left:16px;right:16px}.runway .theme{background:rgba(255,255,255,.12);color:#fff}.runway .theme span{color:#e9d8ff}.runway .brand{background:rgba(255,255,255,.12)}
@media (max-width:760px){
 .top{left:10px;right:10px;top:10px;flex-wrap:nowrap}.timer{padding:9px 12px;font-size:14px}.brand{display:none}.theme b{font-size:13.5px}.theme span{display:none}
 .players{top:72px;right:8px;width:auto;flex-direction:column;gap:5px}.pl{width:38px;height:38px}
 .rail{display:none}
 .closet{top:auto;left:6px;right:6px;width:auto;height:46%;bottom:0;border-radius:24px 24px 0 0;padding:10px;gap:7px;overflow:auto}.search{display:none}
 .grid{grid-template-columns:repeat(4,1fr);gap:6px;flex:none;overflow:visible}.card{padding:4px;font-size:10px}
 .dock{left:50%;bottom:calc(46% + 10px)}.done{padding:10px 22px;font-size:14px!important;white-space:nowrap}.round{width:40px;height:40px}
 .mtabs{display:flex!important}
}
.mtabs{display:none;flex:0 0 auto;min-height:32px;gap:5px;overflow-x:auto;padding-bottom:2px}
.mtabs::-webkit-scrollbar{display:none}
.mtabs b{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:#fff4f8;font-size:12px;font-weight:700;cursor:pointer}
.mtabs b.on{background:var(--pink);color:#fff}

function outerOff(d) {
  return Math.max(d.outerInf || 0, d.topInf || 0.015);
}
function backZ(d) {
  return -(d.T.chest * 0.75 + outerOff(d) + 0.012);
}
function tubePath(pts, rad, segs = 16, rSegs = 8) {
  const curve = new THREE10.CatmullRomCurve3(pts.map(([x, y, z]) => new THREE10.Vector3(x, y, z)));
  return new THREE10.TubeGeometry(curve, segs, rad, rSegs, false);
}
function starShape(rOut, rIn = rOut * 0.44) {
  const sh = new THREE10.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? rIn : rOut, a = i / 10 * Math.PI * 2 + Math.PI / 2;
    i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  sh.closePath();
  return sh;
}

function sw(id, cols, val, fn) {

var pick = (a) => a[Math.floor(Math.random() * a.length)];
