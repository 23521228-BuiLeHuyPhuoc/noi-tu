<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--pink:#ff5c8a;--pink2:#ffb3c7;--ink:#3b2a3f;--ink2:#7a6880;--glass:rgba(255,255,255,.86);--line:#f1e3ee}

#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.pill{background:var(--glass);border-radius:999px;box-shadow:0 6px 24px rgba(160,90,150,.18);backdrop-filter:blur(10px)}
.top{position:fixed;top:16px;left:108px;right:420px;display:flex;gap:12px;align-items:center;z-index:3}
.brand{padding:10px 18px;font-weight:800;font-size:18px;color:var(--pink)}
.theme{flex:1;padding:10px 20px;display:flex;flex-direction:column;border-radius:22px}
.theme small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--pink)}
.theme b{font-size:17px}.theme span{font-size:12.5px;color:var(--ink2)}
.timer{padding:12px 18px;font-weight:800;font-size:18px;background:linear-gradient(135deg,#ff7aa2,#ff5c8a);color:#fff}
.players{position:fixed;top:16px;right:16px;width:388px;display:flex;gap:8px;justify-content:flex-end;z-index:3}
.pl{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(160,90,150,.2);position:relative;overflow:hidden;border:3px solid #fff}
.pl img{width:100%;height:100%;object-fit:cover}.pl.ok::after{content:'✓';position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#5fd3a6;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
.rail{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:28px;z-index:3}
.cat{width:64px;padding:8px 0;border-radius:20px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:600 11px 'Be Vietnam Pro';color:var(--ink2)}

}

<script type="module">
// app.js — dressing room + runway for the redesigned fashion game (design prototype).
import * as THREE from 'three';
// doll.js — stylised toon fashion doll (~4.2 heads) with freely combinable layered clothing.
// Every garment is its own layer on a slot; any top + bottom + shoes + hair + hat + glasses + accessories combine.
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// ---------- toon look ----------
const gradient = (() => {
  const d = new Uint8Array([90, 170, 255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const patCache = new Map();
function patternTex(p, c, c2) {
  const key = p + c + c2; if (patCache.has(key)) return patCache.get(key);
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.fillStyle = c; g.fillRect(0, 0, 128, 128); g.fillStyle = c2; g.strokeStyle = c2;
  if (p === 'stripe') for (let i = 0; i < 8; i++) g.fillRect(0, i * 16, 128, 7);
  if (p === 'dots') for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.beginPath(); g.arc(16 + x * 32 + (y % 2) * 16, 16 + y * 32, 6, 0, 7); g.fill(); }
  if (p === 'check') { g.globalAlpha = 0.55; for (let i = 0; i < 4; i++) { g.fillRect(i * 32, 0, 14, 128); g.fillRect(0, i * 32, 128, 14); } }
  if (p === 'heart') for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
    const cx = 22 + x * 42 + (y % 2) * 21, cy = 22 + y * 42; g.beginPath(); g.moveTo(cx, cy + 9);
    g.bezierCurveTo(cx - 14, cy - 2, cx - 6, cy - 12, cx, cy - 4); g.bezierCurveTo(cx + 6, cy - 12, cx + 14, cy - 2, cx, cy + 9); g.fill(); }
  if (p === 'flower') for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
    const cx = 22 + x * 42 + (y % 2) * 21, cy = 22 + y * 42;
    for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(cx + Math.cos(k * 1.256) * 6, cy + Math.sin(k * 1.256) * 6, 4.5, 0, 7); g.fill(); }
    g.fillStyle = '#fff4b0'; g.beginPath(); g.arc(cx, cy, 3, 0, 7); g.fill(); g.fillStyle = c2; }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); t.colorSpace = THREE.SRGBColorSpace;
  patCache.set(key, t); return t;
}
const matCache = new Map();
function toon(color, pattern = 'plain', c2 = '#ffffff') {
  const key = color + pattern + c2; if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color: pattern === 'plain' ? color : '#ffffff', gradientMap: gradient });
  if (pattern !== 'plain') m.map = patternTex(pattern, color, c2);
  matCache.set(key, m); return m;
}
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x3b2a3f, side: THREE.BackSide });
outlineMat.onBeforeCompile = (s) => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.0055;'); };
function mesh(geo, mat, outline = true) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = true;
  if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.raycast = () => {}; m.add(o); }
  return m;
}
// lathe from [[r, y], ...] bottom→top, elliptic section (sz), smooth
function lathe(prof, sz = 1, segs = 40, gap = 0) {
  const pts = new THREE.SplineCurve(prof.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(prof.length * 6);
  const g = new THREE.LatheGeometry(pts, segs, gap / 2, Math.PI * 2 - gap); g.scale(1, 1, sz); g.computeVertexNormals(); return g;
}
const sph = (rx, ry, rz, w = 32, h = 20) => new THREE.SphereGeometry(1, w, h).scale(rx, ry, rz);

// ---------- body ----------
const SKINS = ['#ffe3d3', '#f7cfb6', '#eab08e', '#c98b66', '#8f5b3e', '#5e3a28'];
const TYPES = {
  girl: { sh: 0.135, hip: 0.15, waist: 0.105, chest: 0.13, leg: 0.058 },
  boy: { sh: 0.16, hip: 0.13, waist: 0.125, chest: 0.14, leg: 0.062 },
};
const Y = { ankle: 0.05, knee: 0.37, hip: 0.68, waist: 0.86, chest: 0.99, shoulder: 1.09, neck: 1.15, head: 1.34 };

class Doll {
  constructor(opts = {}) {
    this.root = new THREE.Group(); this.slots = {}; this.outfit = null; this.ghost = !!opts.ghost;
    this.build(opts.type || 'girl', opts.skin || SKINS[1]);
  }
  skinMat(c) { return this.ghost ? new THREE.MeshToonMaterial({ color: '#e9e3f0', gradientMap: gradient, transparent: true, opacity: 0.55 }) : toon(c); }
  build(type, skin) {
    this.type = type; this.skin = skin; const T = TYPES[type]; this.T = T;
    this.root.clear(); const S = this.skinMat(skin); this.skinM = S; const out = !this.ghost;
    const r = this.root;
    // pivots
    const hips = new THREE.Group(); hips.position.y = Y.hip; r.add(hips);
    const chest = new THREE.Group(); chest.position.y = Y.waist - Y.hip; hips.add(chest);
    const neck = new THREE.Group(); neck.position.y = Y.neck - Y.waist; chest.add(neck);
    this.j = { hips, chest, neck };
    // torso (two lathes so it can bend at the waist)
    hips.add(mesh(lathe([[0.06, -0.08], [T.hip * 0.92, -0.04], [T.hip, 0.02], [T.hip * 0.9, 0.1], [T.waist, 0.18], [T.waist, 0.2]], 0.74).translate(0, 0, 0), S, out));
    chest.add(mesh(lathe([[T.waist, -0.02], [T.waist * 1.05, 0.04], [T.chest, 0.13], [T.sh * 0.98, 0.2], [T.sh * 0.7, 0.26], [0.045, 0.29], [0.04, 0.31]], 0.72), S, out));
    neck.add(mesh(new THREE.CylinderGeometry(0.038, 0.042, 0.1, 20).translate(0, 0.02, 0), S, out));
    // head
    const head = new THREE.Group(); head.position.y = Y.head - Y.neck; neck.add(head); this.j.head = head;
    head.add(mesh(sph(0.175, 0.17, 0.165, 40, 28), S, out));
    for (const s of [1, -1]) head.add(mesh(sph(0.03, 0.04, 0.02).translate(s * 0.17, -0.01, 0), S, out));
    this.face = new THREE.Group(); head.add(this.face); this.buildFace('#4a2d24');
    // arms
    this.j.arm = {};
    for (const s of [1, -1]) {
      const sh = new THREE.Group(); sh.position.set(s * T.sh, Y.shoulder - Y.waist, 0); chest.add(sh);
      sh.add(mesh(sph(0.05, 0.05, 0.05), S, out));
      sh.add(mesh(lathe([[0.034, -0.24], [0.04, -0.12], [0.046, -0.01], [0.03, 0.03]], 1, 24), S, out));
      const el = new THREE.Group(); el.position.y = -0.24; sh.add(el);
      el.add(mesh(lathe([[0.026, -0.2], [0.034, -0.08], [0.036, 0.0], [0.02, 0.025]], 1, 24), S, out));
      const hand = new THREE.Group(); hand.position.y = -0.21; el.add(hand);
      hand.add(mesh(sph(0.034, 0.048, 0.026).translate(0, -0.03, 0.004), S, out));
      hand.add(mesh(sph(0.012, 0.022, 0.012).translate(-s * 0.026, -0.02, 0.016).rotateZ(s * 0.4), S, out));
      this.j.arm[s] = { sh, el, hand };
    }
    // legs
    this.j.leg = {};
    for (const s of [1, -1]) {
      const th = new THREE.Group(); th.position.set(s * 0.07, -0.02, 0); hips.add(th);
      th.add(mesh(lathe([[T.leg * 0.72, -0.3], [T.leg * 0.85, -0.2], [T.leg, -0.04], [T.leg * 0.6, 0.04]], 1, 28), S, out));
      const kn = new THREE.Group(); kn.position.y = -0.3; th.add(kn);
      kn.add(mesh(lathe([[0.03, -0.31], [0.04, -0.2], [0.045, -0.06], [0.042, 0.02], [0.03, 0.04]], 1, 28), S, out));
      const ft = new THREE.Group(); ft.position.y = -0.31; kn.add(ft);
      ft.add(mesh(sph(0.04, 0.03, 0.075).translate(0, -0.02, 0.03), S, out));
      this.j.leg[s] = { th, kn, ft };
    }
    if (this.outfit) this.apply(this.outfit);
  }
  buildFace(eyeColor, lip = '#e0707a') {
    const f = this.face; f.clear(); if (this.ghost) return;
    const dark = new THREE.MeshBasicMaterial({ color: eyeColor }), white = new THREE.MeshBasicMaterial({ color: '#ffffff' });
    const blush = new THREE.MeshBasicMaterial({ color: '#ff8fa8', transparent: true, opacity: 0.45 });
    for (const s of [1, -1]) {
      const eye = new THREE.Mesh(sph(0.027, 0.04, 0.012), dark); eye.position.set(s * 0.062, -0.005, 0.158); eye.rotation.y = s * 0.36; f.add(eye);
      const hl = new THREE.Mesh(sph(0.009, 0.012, 0.004), white); hl.position.set(s * 0.062 + 0.008, 0.01, 0.17); f.add(hl);
      const hl2 = new THREE.Mesh(sph(0.004, 0.005, 0.003), white); hl2.position.set(s * 0.062 - 0.006, -0.02, 0.169); f.add(hl2);
      const lash = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.0045, 6, 16, Math.PI * 0.8), dark);
      lash.position.set(s * 0.062, 0.0, 0.158); lash.rotation.set(0, s * 0.36, Math.PI * 0.1); f.add(lash);
      const brow = new THREE.Mesh(new THREE.CapsuleGeometry(0.004, 0.03, 4, 8), dark);
      brow.position.set(s * 0.064, 0.065, 0.152); brow.rotation.set(0, s * 0.36, Math.PI / 2 + s * 0.12); f.add(brow);
      const b = new THREE.Mesh(sph(0.03, 0.016, 0.006), blush); b.position.set(s * 0.1, -0.055, 0.137); b.rotation.y = s * 0.6; f.add(b);
    }
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.004, 6, 16, Math.PI), new THREE.MeshBasicMaterial({ color: lip }));
    mouth.position.set(0, -0.075, 0.158); mouth.rotation.z = Math.PI; f.add(mouth);
  }
  clear(slot) { const g = this.slots[slot]; if (g) { g.forEach((m) => m.parent && m.parent.remove(m)); } this.slots[slot] = []; }
  put(slot, parent, m) { parent.add(m); this.slots[slot].push(m); return m; }
  apply(o) {
    this.outfit = JSON.parse(JSON.stringify(o)); this.armSpread = 0;
    if (o.type && (o.type !== this.type || o.skin !== this.skin)) { const keep = this.outfit; this.outfit = null; this.build(o.type, o.skin); this.outfit = keep; }
    if (!this.ghost) this.buildFace(o.eye || '#4a2d24', o.lip);
    for (const slot of Object.keys(BUILD)) {
      this.clear(slot); const it = o[slot]; if (!it || !it.id) continue;
      if (slot === 'dress' && (o.top || o.bottom)) continue;
      const fn = BUILD[slot][it.id]; if (fn) fn(this, it, (m) => this.put(slot, ...m));
    }
    if (o.hat && ['cap', 'witch', 'sunhat', 'beret'].includes(o.hat.id)) for (const m of this.slots.hair || []) {
      m.geometry.computeBoundingSphere(); if (m.geometry.boundingSphere.center.y > 0.11 && m.geometry.boundingSphere.radius < 0.1) m.visible = false; }
  }
}

// ---------- garment helpers ----------
const M = (it) => toon(it.c, it.p || 'plain', it.c2 || '#ffffff');
const A = (it) => toon(it.c2 || '#ffffff');
function torsoShell(d, it, y0, y1, inf, flare = 0) {
  if (y0 < Y.waist - 0.01) { inf = Math.max(inf, 0.018); flare = Math.max(flare, 0.012); } // chest-space shell from y0 (hip-space if < 0) to y1
  const T = d.T, P = [];
  const prof = [[T.hip, Y.hip], [T.hip * 0.95, Y.hip + 0.06], [T.waist, Y.waist], [T.chest, Y.chest], [T.sh * 0.98, Y.chest + 0.07], [T.sh * 0.72, Y.chest + 0.13], [0.05, Y.neck]];
  const rAt = (y) => { for (let i = 0; i < prof.length - 1; i++) if (y <= prof[i + 1][1]) { const t = (y - prof[i][1]) / (prof[i + 1][1] - prof[i][1]); return prof[i][0] + (prof[i + 1][0] - prof[i][0]) * t; } return 0.05; };
  for (let i = 0; i <= 10; i++) { const y = y0 + (y1 - y0) * i / 10; P.push([rAt(y) + inf + (i === 0 ? flare : flare * Math.max(0, 1 - i / 4)), y - Y.waist]); }
  if (y1 >= Y.neck - 0.01) P.push([0.048 + inf * 0.5, Y.neck - Y.waist + 0.01]);
  const g = lathe(P, 0.75); return mesh(g, M(it));
}
function sleeve(d, it, s, len, inf = 0.012, puff = 0) {
  const { sh, el } = d.j.arm[s], out = [];
  out.push([sh, mesh(lathe([[0.04 + inf + puff * 0.6, -Math.min(len, 0.24)], [0.046 + inf + puff, -0.12], [0.05 + inf + puff * 0.5, 0.0], [0.03, 0.05]], 1, 24), M(it))]);
  if (len > 0.24) out.push([el, mesh(lathe([[0.03 + inf + 0.004, -(len - 0.24)], [0.036 + inf, -0.08], [0.04 + inf, 0.02]], 1, 24), M(it))]);
  return out;

function animate(d, mode, t) {
  const j = d.j, L = j.leg, Ar = j.arm;
  const sp = 0.12 + (d.armSpread || 0); for (const s of [1, -1]) { L[s].th.rotation.set(0, 0, 0); L[s].kn.rotation.set(0, 0, 0); L[s].ft.rotation.set(0, 0, 0); Ar[s].sh.rotation.set(0, 0, s * sp); Ar[s].el.rotation.set(-0.08, 0, -s * (d.armSpread || 0) * 0.4); }
  j.hips.rotation.set(0, 0, 0); j.chest.rotation.set(0, 0, 0); j.head.rotation.set(0, 0, 0); d.root.position.y = 0;
  if (mode === 'idle') { const b = Math.sin(t * 2); j.chest.rotation.z = 0.015 * b; j.head.rotation.z = 0.03 * Math.sin(t * 1.3); j.hips.rotation.y = 0.04 * Math.sin(t * 0.7);
    Ar[1].sh.rotation.z = sp + 0.02 * b; Ar[-1].sh.rotation.z = -sp - 0.02 * b; }
  if (mode === 'walk') { const p = t * 6.5, s = Math.sin(p), c = Math.cos(p);
    L[1].th.rotation.x = -0.45 * s; L[-1].th.rotation.x = 0.45 * s; L[1].kn.rotation.x = 0.6 * Math.max(0, c); L[-1].kn.rotation.x = 0.6 * Math.max(0, -c);
    Ar[1].sh.rotation.x = 0.4 * s; Ar[-1].sh.rotation.x = -0.4 * s; j.hips.rotation.y = 0.12 * s; j.hips.rotation.z = 0.05 * s; j.chest.rotation.y = -0.15 * s; d.root.position.y = 0.012 * Math.abs(c); }
  if (mode === 'pose') { Ar[1].sh.rotation.z = 0.5; Ar[1].el.rotation.z = -1.6; Ar[-1].sh.rotation.z = -2.6; Ar[-1].el.rotation.z = -0.5; j.hips.rotation.z = -0.08; j.head.rotation.z = 0.15; L[-1].th.rotation.x = -0.15; L[-1].kn.rotation.x = 0.25; L[-1].th.rotation.z = -0.08; }
}

const $ = (id) => document.getElementById(id);
const mobile = matchMedia('(max-width:760px)').matches;
const renderer = new THREE.WebGLRenderer({ canvas: $('stage'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);

// ---------- two environments ----------
const bgTex = (top, bot) => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const room = new THREE.Group(), runway = new THREE.Group(); scene.add(room, runway);
const hemi = new THREE.HemisphereLight('#fff6fb', '#e7c9e6', 1.6); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffffff', 1.7); key.position.set(1.5, 3, 2.5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2, bottom: -0.5 }); scene.add(key);
// dressing room: soft podium + sparkles
const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.66, 0.06, 64).translate(0, -0.03, 0), toon('#ffd3e2')); podium.receiveShadow = true; room.add(podium);
room.add(new THREE.Mesh(new THREE.TorusGeometry(0.64, 0.012, 8, 80).rotateX(Math.PI / 2), toon('#ffffff')));
const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 64).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.12 })); floor.position.y = -0.059; floor.receiveShadow = true; room.add(floor);
for (let i = 0; i < 26; i++) { const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.02 + Math.random() * 0.02), new THREE.MeshBasicMaterial({ color: ['#ffffff', '#ffd56b', '#ffb3c7'][i % 3] }));
  const a = Math.random() * Math.PI * 2, r = 1.1 + Math.random() * 1.2; s.position.set(Math.cos(a) * r, 0.2 + Math.random() * 1.8, -0.8 - Math.random() * 1.5); room.add(s); }
// runway: dark stage, catwalk, bulbs, spot
const walk = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 9), toon('#2a1f3d')); walk.position.set(0, -0.04, -3.6); walk.receiveShadow = true; runway.add(walk);
const glow = new THREE.MeshBasicMaterial({ color: '#ffe6a8' });
for (let i = 0; i < 26; i++) for (const s of [1, -1]) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), glow); b.position.set(s * 0.68, 0.02, 0.8 - i * 0.34); runway.add(b); }
const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 9).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#ff5c8a' })); stripe.position.set(0, 0.002, -3.6); runway.add(stripe);
for (let i = 0; i < 18; i++) for (const s of [1, -1]) { const p = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.25, 4, 8), new THREE.MeshBasicMaterial({ color: '#160f22' })); p.position.set(s * (1.25 + (i % 3) * 0.35), 0.25, 0.6 - i * 0.5); runway.add(p); }
const spot = new THREE.SpotLight('#fff1fb', 30, 8, 0.35, 0.6); spot.position.set(0, 4, 2); spot.castShadow = true; runway.add(spot, spot.target);

// ---------- doll + state ----------
const doll = new Doll({ type: 'girl', skin: SKINS[1] }); scene.add(doll.root);
let outfit = { type: 'girl', skin: SKINS[1], eye: '#4a2d24', hair: { id: 'ponytail', c: HAIRCOL[1] }, top: { id: 'blouse', c: '#ffb3c7', c2: '#ffffff', p: 'plain' },
  bottom: { id: 'pleated', c: '#2f6fd6', c2: '#ffffff', p: 'check' }, shoes: { id: 'loafer', c: '#2b2533', c2: '#ffffff' }, hat: { id: 'beret', c: '#ff6b8b' }, glasses: null, acc: { id: 'bag', c: '#ff6b8b', c2: '#ffd56b' } };
doll.apply(outfit);
const hist = [], fut = []; const set = (o, rec = true) => { if (rec) { hist.push(JSON.stringify(outfit)); fut.length = 0; } outfit = o; doll.apply(outfit); ui(); };

// ---------- thumbnails (ghost mannequin, item only) ----------
const tR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); tR.setSize(150, 150); tR.outputColorSpace = THREE.SRGBColorSpace;
const tS = new THREE.Scene(); tS.add(new THREE.HemisphereLight('#ffffff', '#e8d3e6', 2.2)); const tk = new THREE.DirectionalLight('#fff', 1.6); tk.position.set(1, 2, 3); tS.add(tk);
const ghost = new Doll({ ghost: true }); tS.add(ghost.root); const tC = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
const DEF = { hair: '#5a3825', top: '#ff9ec4', bottom: '#6ec6ff', dress: '#c79bff', shoes: '#ff6b8b', hat: '#ffd56b', glasses: '#2b2533', acc: '#ff6b8b' };
const FRAME = { hair: [1.36, 0.95, 0.15], hat: [1.45, 1.1, 0.2], glasses: [1.34, 0.6, 0], top: [1.0, 1.35, 0], bottom: [0.5, 1.9, 0], dress: [0.72, 2.6, 0], shoes: [0.04, 0.75, 0.35], acc: [0.95, 1.9, 0] };
const thumbs = {};
function thumb(slot, id) {
  const k = slot + id; if (thumbs[k]) return thumbs[k];
  const o = { type: 'girl', skin: SKINS[1] }; o[slot] = { id, c: DEF[slot], c2: '#ffffff', p: 'plain' };
  if (slot !== "hair") o.hair = null; ghost.apply(o); ghost.j.head.visible = ["hair", "hat", "glasses"].includes(slot); ghost.root.rotation.y = slot === "acc" ? 0.5 : 0.35;
  const [y, dist, el] = FRAME[slot]; tC.position.set(0, y + el * dist, dist); tC.lookAt(0, y, 0); tR.render(tS, tC);
  return (thumbs[k] = tR.domElement.toDataURL());
}
// room member portraits
function portrait(o) { const p = new Doll({ type: o.type, skin: o.skin }); p.apply(o); tS.remove(ghost.root); tS.add(p.root); p.root.rotation.y = 0.3; tC.position.set(0, 1.33, 0.8); tC.lookAt(0, 1.3, 0); tR.render(tS, tC); const u = tR.domElement.toDataURL(); tS.remove(p.root); tS.add(ghost.root); return u; }

// ---------- UI ----------
const CATS = [['body', '🧸', 'Cơ thể'], ['hair', '💇‍♀️', 'Tóc'], ['top', '👚', 'Áo'], ['bottom', '👖', 'Quần/Váy'], ['dress', '👗', 'Đầm'], ['shoes', '👟', 'Giày'], ['hat', '👒', 'Mũ'], ['glasses', '🕶️', 'Kính'], ['acc', '👜', 'Phụ kiện']];
let tab = 'top';
function ui() {
  $('rail').innerHTML = CATS.map(([k, e, n]) => `<button class="cat ${k === tab ? 'on' : ''}" data-k="${k}"><i>${e}</i>${n}</button>`).join('');
  $('mtabs').innerHTML = CATS.map(([k, e, n]) => `<b class="${k === tab ? 'on' : ''}" data-k="${k}">${e} ${n}</b>`).join('');
  document.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { tab = b.dataset.k; ui(); }));
  const cat = CATS.find((c) => c[0] === tab); $('cTitle').textContent = cat[2];
  const g = $('grid'), cur = outfit[tab];
  if (tab === 'body') {
    $('cCount').textContent = ''; g.innerHTML = [['girl', 'Dáng nữ'], ['boy', 'Dáng nam']].map(([t, n]) => `<div class="card ${outfit.type === t ? 'on' : ''}" data-t="${t}"><img src="${portrait({ ...outfit, type: t })}">${n}</div>`).join('');
    g.querySelectorAll('[data-t]').forEach((c) => (c.onclick = () => set({ ...outfit, type: c.dataset.t })));
    sw('sw1', SKINS, outfit.skin, (c) => set({ ...outfit, skin: c })); sw('sw2', ['#4a2d24', '#2b2533', '#3f7d5a', '#2f6fd6', '#8a5cc9', '#b8543b'], outfit.eye, (c) => set({ ...outfit, eye: c }));
    $('r3').style.display = 'none'; return;
  }
  const list = CATALOG[tab]; $('cCount').textContent = list.length + ' món';
  g.innerHTML = (tab === 'hair' || tab === 'shoes' ? '' : `<div class="card none ${!cur ? 'on' : ''}" data-id="">∅</div>`) + list.map(([id, n]) => `<div class="card ${cur && cur.id === id ? 'on' : ''}" data-id="${id}"><img src="${thumb(tab, id)}">${n}</div>`).join('');
  g.querySelectorAll('[data-id]').forEach((c) => (c.onclick = () => {
    const o = { ...outfit }, id = c.dataset.id;
    if (!id) o[tab] = null; else o[tab] = { ...(cur || { c: DEF[tab], c2: '#ffffff', p: 'plain' }), id };
    if (tab === 'dress' && id) { o.top = null; o.bottom = null; }
    if ((tab === 'top' || tab === 'bottom') && id) o.dress = null;
    set(o);
  }));
  const it = cur || {}, upd = (k) => (v) => { if (!cur) return; set({ ...outfit, [tab]: { ...cur, [k]: v } }); };
  sw('sw1', tab === 'hair' ? HAIRCOL : PALETTE, it.c, upd('c')); sw('sw2', PALETTE, it.c2, upd('c2'));
  $('r3').style.display = tab === 'hair' || tab === 'glasses' ? 'none' : '';
  $('pat').innerHTML = PATTERNS.map(([p, n]) => `<b class="${(it.p || 'plain') === p ? 'on' : ''}" data-p="${p}">${n}</b>`).join('');
  $('pat').querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => upd('p')(b.dataset.p)));
}
function sw(id, cols, val, fn) { $(id).innerHTML = cols.map((c) => `<b class="${c === val ? 'on' : ''}" style="background:${c}" data-c="${c}"></b>`).join(''); $(id).querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => fn(b.dataset.c))); }
$('undo').onclick = () => { if (hist.length) { fut.push(JSON.stringify(outfit)); outfit = JSON.parse(hist.pop()); doll.apply(outfit); ui(); } };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function random() { const o = { ...outfit, hair: { id: pick(CATALOG.hair)[0], c: pick(HAIRCOL) } }; const it = (s) => ({ id: pick(CATALOG[s])[0], c: pick(PALETTE), c2: pick(PALETTE), p: Math.random() < 0.4 ? pick(PATTERNS)[0] : 'plain' });
  if (Math.random() < 0.3) { o.dress = it('dress'); o.top = o.bottom = null; } else { o.top = it('top'); o.bottom = it('bottom'); o.dress = null; }
  o.shoes = it('shoes'); o.hat = Math.random() < 0.6 ? it('hat') : null; o.glasses = Math.random() < 0.4 ? it('glasses') : null; o.acc = Math.random() < 0.6 ? it('acc') : null; return o; }
$('rnd').onclick = () => set(random());
let mode = 'room'; $('done').onclick = () => view('runway'); $('cat').onclick = () => view(mode === 'room' ? 'runway' : 'room');
// room strip: other players' live looks
const friends = [0, 1, 2, 3].map(() => random());
$('players').innerHTML = friends.map((f, i) => `<div class="pl ${i % 2 ? 'ok' : ''}"><img src="${portrait(f)}"></div>`).join('');

// ---------- views ----------
let walkT = null;
function view(v) {
  mode = v; document.body.classList.toggle('runway', v === 'runway'); room.visible = v === 'room'; runway.visible = v === 'runway';
  scene.background = v === 'room' ? bgTex('#fde4f1', '#e9dcff') : bgTex('#0f0a1c', '#2b1740');
  hemi.intensity = v === 'room' ? 1.6 : 0.5; key.intensity = v === 'room' ? 1.7 : 0.3; resize();
}
let dragX = null, rotY = 0.25;
$('stage').addEventListener('pointerdown', (e) => (dragX = e.clientX)); addEventListener('pointerup', () => (dragX = null));
addEventListener('pointermove', (e) => { if (dragX != null && mode === 'room') { rotY += (e.clientX - dragX) * 0.01; dragX = e.clientX; } });
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  if (mode === 'room') { if (mobile) { camera.setViewOffset(w, h, 0, h * 0.2, w, h); camera.fov = 30; } else { camera.setViewOffset(w, h, 200 - 40, 0, w, h); camera.fov = 26; } }
  else { camera.clearViewOffset(); camera.fov = 32; }
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
const clock = new THREE.Clock();
function loop() {
  const t = clock.getElapsedTime();
  if (mode === 'room') { doll.root.position.z = 0; doll.root.rotation.y = rotY; animate(doll, 'idle', t); camera.position.set(0, 0.98, mobile ? 7.6 : 5.5); camera.lookAt(0, 0.84, 0); }
  else { const u = walkT ?? ((t * 0.16) % 1); doll.root.position.z = -6 + u * 6.4; doll.root.rotation.y = 0; animate(doll, u > 0.97 ? 'pose' : 'walk', t);
    camera.position.set(0.55, 0.95, doll.root.position.z + 4.8); camera.lookAt(0, 0.82, doll.root.position.z); spot.target.position.set(0, 0.6, doll.root.position.z); spot.position.set(0, 4, doll.root.position.z + 1.5); }
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
view('room'); ui(); loop();
window.design = { ready: true, view, set: (o) => set(o, false), random: () => set(random(), false), tab: (k) => { tab = k; ui(); }, walkAt: (u) => (walkT = u), get outfit() { return outfit; } };

</script>
</body></html>
